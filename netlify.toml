[build]
  command = "npm run build"
  # Must match the `publish` option passed to adapter-netlify in vite.config.ts.
  publish = "build"

[build.environment]
  # SvelteKit 3 requires Node 22.17 or newer.
  NODE_VERSION = "22"

# Hashed build output never changes, so browsers can cache it for good.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

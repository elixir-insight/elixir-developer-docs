customHeaders:
  # Hashed build output never changes, so browsers can cache it for good.
  - pattern: '/_app/immutable/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: DENY
